services:
  cabledesigner2000:
    build: .
    image: cabledesigner2000:latest
    container_name: cabledesigner2000
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # set to true once the UI is only reachable via HTTPS (e.g. behind a reverse proxy)
      COOKIE_SECURE: "false"
      # behind a reverse proxy: number of proxy hops, usually 1 (correct client IP for login throttling)
      TRUST_PROXY: ""
      # validity of a login session in days
      SESSION_DAYS: "30"
    volumes:
      - cabledesigner-data:/data

volumes:
  cabledesigner-data:
    # fixed name, independent of the folder the compose file lives in
    name: cabledesigner2000-data
